server:
  port: 8080

ai-server:
  url: "http://192.168.22.53:8000"  #팀원의 IP

# 사용자가 올리는 사진 파일의 최대 크기를 설정합니다.
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 데이터베이스 연결 정보 (기존 설정 유지)
  datasource:
    url: jdbc:postgresql://localhost:5432/mydb
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true